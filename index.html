<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f6fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物件管理">
<title>物件管理 / Controle de Imóveis</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mut:#6b7885;--pri:#0f6fb5;--ok:#1f9d55;--warn:#d9822b;--bad:#c0392b;--line:#e1e6eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;cursor:pointer;min-width:150px}
header button,header select{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:7px 11px;font-size:14px;cursor:pointer}
header select option{color:#000}
main{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;display:block}
a.card{transition:transform .1s}a.card:hover{transform:translateY(-2px)}
.ph{width:100%;aspect-ratio:4/3;background:#dde3e9 center/cover;display:flex;align-items:center;justify-content:center;color:#9aa6b2;font-size:40px}
.pad{padding:12px}
.card h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;margin:2px 4px 2px 0}
.b-vac,.b-ok{background:var(--ok)}.b-occ,.b-bad{background:var(--bad)}.b-res{background:var(--warn)}.b-gray{background:#8795a1}.b-pri{background:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.bar input,.bar select{width:auto}
.bar input.grow{flex:1;min-width:180px}
button.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
button.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
button.btn.red{background:var(--bad)}
button.btn.sm{padding:5px 9px;font-size:12px}
button.btn:disabled{opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile b{display:block;font-size:24px;line-height:1.1}.tile span{font-size:12px;color:var(--mut)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.unit{border-radius:10px;padding:10px 6px;text-align:center;color:#fff;font-weight:600;display:block}
.unit small{display:block;font-weight:400;font-size:11px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.thumbs figure{margin:0;text-align:center;font-size:11px;color:var(--mut);flex:none}
.thumbs img{height:60px;border-radius:6px;cursor:pointer;display:block}
.big{width:100%;border-radius:12px;max-height:420px;object-fit:cover;background:#dde3e9;cursor:zoom-in}
.price{font-size:26px;font-weight:700;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;white-space:nowrap}
.fac{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:8px}
.fac div{background:var(--bg);border-radius:8px;padding:7px 9px;font-size:13px}
.fac .no{opacity:.4;text-decoration:line-through}.fac .unk{opacity:.5;border:1px dashed var(--line)}.fac .co{border-left:4px solid var(--pri)}.fac .own{border-left:4px solid var(--ok)}.fac small{color:var(--mut);display:block;font-size:11px}.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.tl{border-left:3px solid var(--line);margin-left:6px;padding-left:14px}
.tl>div{margin-bottom:14px;position:relative}
.tl>div:before{content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--pri)}
.tl>div.cur:before{background:var(--ok)}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.imgs img{height:70px;border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
.modal .box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:560px}
.modal h2{margin:0 0 12px;font-size:18px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:10px}.chk label{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:14px;margin:0}.chk input{width:auto}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:30}
.lightbox img{max-width:95%;max-height:92%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:40;font-size:14px}
.demo{background:#fff4d6;color:#7a5a00;padding:7px 14px;font-size:13px;text-align:center}
.crumb{margin-bottom:12px;font-size:14px}.crumb a{color:var(--pri)}
h3.sec{margin:20px 0 8px;font-size:16px}
/* vistoria */
.chkrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chkrow .nm{flex:1;min-width:150px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--mut)}
.seg button.on-ok{background:var(--ok);color:#fff}.seg button.on-ng{background:var(--bad);color:#fff}
.chkrow input.ngtxt{flex-basis:100%;margin-top:2px}
.issue{background:#fdecea;border-radius:8px;padding:6px 9px;margin-top:4px;font-size:13px}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:600px){
 header{position:static;padding:8px 12px;gap:6px}
 header h1{flex-basis:100%;font-size:16px}
 header button,header select{padding:6px 9px;font-size:13px}
 main{padding:12px}
 .modal{padding:10px}.modal .box{padding:14px}
}
</style>
</head>

/* =====================================================================
 * Configuração e camada de dados
 * =================================================================== */
// Link de configuração opcional:  index.html?u=<URL>&k=<SENHA>  (guarda e limpa a barra de endereço)
(function(){try{const q=new URLSearchParams(location.search);if(q.get("u")){localStorage.setItem("api_url",q.get("u"));if(q.get("k")!==null)localStorage.setItem("api_tok",q.get("k"));history.replaceState(null,"",location.pathname+location.hash)}}catch(e){}})();
const cfg=()=>({url:localStorage.getItem("api_url")||"",tok:localStorage.getItem("api_tok")||""});
const isDemo=()=>!cfg().url;
const LS="imoveis_demo_v2";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TABLES=["buildings","units","persons","stays","inspections"];
const Store={
 async post(action,payload){
  const c=cfg();
  const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:c.tok,...payload})});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
 },
 async all(){
  if(isDemo()){let d=JSON.parse(localStorage.getItem(LS)||"null");if(!d){d=demoData();localStorage.setItem(LS,JSON.stringify(d))}return d}
  return this.post("all",{});
 },
 async upsert(table,row){
  if(isDemo()){const d=JSON.parse(localStorage.getItem(LS));const a=d[table]=d[table]||[];const i=a.findIndex(x=>x.id===row.id);i>=0?a[i]=row:a.push(row);localStorage.setItem(LS,JSON.stringify(d));return}
  await this.post("upsert",{table,row});
 },
 async remove(table,id){
  if(isDemo()){const d=JSON.parse(localStorage.getItem(LS));d[table]=(d[table]||[]).filter(x=>x.id!==id);localStorage.setItem(LS,JSON.stringify(d));return}
  await this.post("remove",{table,id});
 },
 async upload(dataUrl,folder){
  if(isDemo())return dataUrl;
  return (await this.post("upload",{dataUrl,folder})).url;
 }
};

let D={buildings:[],units:[],persons:[],stays:[],inspections:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Marcas: 〇 instalado no apto · ● da empreiteira · × não tem · vazio = não informado
const mk=v=>{v=String(v??"").trim();if(!v)return"";if(/^●/.test(v))return"●";if(/^(〇|○|◯|有|1|true|yes|sim)/i.test(v))return"〇";return"×"};
const has=v=>{const m=mk(v);return m==="〇"||m==="●"};

const okLay=v=>{v=String(v??"").trim();return/^\d{4}-\d\d-\d\d/.test(v)?"":v};

const ROLE_T="契約者",ROLE_H="同居人";
const bById=id=>D.buildings.find(b=>b.id===id);
const uById=id=>D.units.find(u=>u.id===id);
const pById=id=>D.persons.find(p=>p.id===id);
const bName=b=>b?(lang==="pt"&&b.namePt?`${b.namePt} (${b.name})`:b.name):"";
const bShort=b=>b?(lang==="pt"&&b.namePt?b.namePt:b.name):"";
const pName=p=>{if(!p)return t("unknownName");return lang==="ja"?(p.nameJa||p.nameRo):(p.nameRo?p.nameRo+(p.nameJa?` (${p.nameJa})`:""):p.nameJa)};
const unitsOf=b=>D.units.filter(u=>u.buildingId===b).sort((a,b)=>String(a.number).localeCompare(String(b.number),"ja",{numeric:true}));
const sk=s=>s.moveIn||s.moveOut||"";
const staysOf=u=>D.stays.filter(s=>s.unitId===u).sort((a,b)=>sk(b).localeCompare(sk(a)));
const staysOfP=p=>D.stays.filter(s=>s.personId===p).sort((a,b)=>sk(b).localeCompare(sk(a)));
const inspOf=u=>D.inspections.filter(i=>i.unitId===u).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
const roleLbl=r=>r===ROLE_H?t("roleH"):t("roleT");
const typeLbl=v=>{const x=TYPES.find(a=>a[0]===v);return x?t(x[1]):v};
function status(u){
 const td=today(),ss=staysOf(u.id);
 const cur=ss.filter(s=>(!s.moveIn||s.moveIn<=td)&&(!s.moveOut||s.moveOut>=td));
 const fut=ss.filter(s=>s.moveIn&&s.moveIn>td);
 const tit=cur.find(s=>s.role!==ROLE_H)||cur[0];
 const leaving=tit&&tit.moveOut?tit.moveOut:"";
 return{code:cur.length?"occ":fut.length?"res":"vac",cur,fut,tit,leaving};
}
function dur(a,b){
 if(!a)return"";const d=Math.round(((b?new Date(b):new Date())-new Date(a))/864e5);if(!(d>=0))return"";
 const m=Math.floor(d/30.44);
 if(m>=12)return Math.floor(m/12)+L2(" a ","年")+(m%12)+L2(" m","ヶ月");
 return m>=1?m+L2(" m","ヶ月"):d+L2(" d","日");
}
const encodeItem=it=>it.s==="ok"?"OK":it.s==="ng"?(it.n?"NG: "+it.n:"NG"):it.s==="na"?"-":"";
function decodeItem(v){v=String(v??"");if(!v)return{s:"",n:""};if(v==="-")return{s:"na",n:""};if(/^NG/i.test(v))return{s:"ng",n:v.replace(/^NG:?\s*/i,"")};return{s:"ok",n:""}}
const CHK=[
 {k:"aircon",app:1,ic:"❄️"},{k:"fridge",app:1,ic:"🧊"},{k:"washer",app:1,ic:"🧺"},{k:"stove",app:1,ic:"🔥"},{k:"riceCooker",app:1,ic:"🍚"},{k:"microwave",app:1,ic:"📡"},
 {k:"lights",ic:"💡"},{k:"cleaning",ic:"🧹",ok:"okCleaning",ng:"ngCleaning"},{k:"trash",ic:"🗑️",ok:"okTrash",ng:"ngTrash"},{k:"walls",ic:"🧱",ok:"okWalls",ng:"ngWalls"}];
const issuesOf=i=>{const o=[];CHK.forEach(c=>{const d=decodeItem(i[c.k]);if(d.s==="ng")o.push({k:c.k,n:d.n})});if(String(i.other||"").trim())o.push({k:"other",n:i.other});return o};

async function reload(){
 $("#app").innerHTML=`<p class="mut">${t("loading")}</p>`;
 try{D=await Store.all();TABLES.forEach(k=>D[k]=D[k]||[])}catch(e){$("#app").innerHTML=`<p>${t("err")}${esc(e.message)}</p>`;return}
 render();
}
function nav(h){if(location.hash==="#"+h)render();else location.hash=h}

 * Roteamento

function render(){
 document.documentElement.lang=lang==="pt"?"pt":"ja";
 $("#ttl").textContent=t("title");$("#bPeople").textContent="👥 "+t("people");$("#bAdmin").textContent="✏️ "+t("admin");
 $("#lang").value=lang;$("#demo").style.display=isDemo()?"block":"none";$("#demo").textContent=t("demo");
 const parts=location.hash.replace(/^#\/?/,"").split("/");const [v,a,b]=parts;
 if(v==="b")rBuilding(a);else if(v==="u")rUnit(a);else if(v==="insp")rInspect(a,b);
 else if(v==="people")rPeople();else if(v==="p")rPerson(a);else if(v==="admin")rAdmin();else rHome();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

let HOME={q:"",onlyVac:false},BF="all",PQ="";
function rHome(){
 const q=HOME.q.toLowerCase();
 let bs=D.buildings.filter(b=>(b.name+" "+(b.namePt||"")+" "+(b.address||"")+" "+(b.addressRo||"")).toLowerCase().includes(q));
 const cnt=bid=>{let v=0,o=0,r=0,n=0;unitsOf(bid).forEach(u=>{n++;const c=status(u).code;c==="vac"?v++:c==="occ"?o++:r++});return{n,v,o,r}};
 if(HOME.onlyVac)bs=bs.filter(b=>cnt(b.id).v>0);
 let T={n:0,v:0,o:0,r:0,l:0};const lim=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
 D.units.forEach(u=>{const s=status(u);T.n++;s.code==="vac"?T.v++:s.code==="occ"?T.o++:T.r++;if(s.leaving&&s.leaving<=lim)T.l++});
 $("#app").innerHTML=`
 <div class="tiles">
  <div class="tile"><b>${T.n}</b><span>${t("tAll")}</span></div>
  <div class="tile"><b style="color:var(--ok)">${T.v}</b><span>${t("tVac")}</span></div>
  <div class="tile"><b style="color:var(--bad)">${T.o}</b><span>${t("tOcc")}</span></div>
  <div class="tile"><b style="color:var(--warn)">${T.r}</b><span>${t("tRes")}</span></div>
  <div class="tile"><b style="color:var(--warn)">${T.l}</b><span>${t("tLeave")}</span></div></div>
 <div class="bar"><input class="grow" id="q" placeholder="${t("search")}" value="${esc(HOME.q)}">
 <label class="mut"><input type="checkbox" id="ov" ${HOME.onlyVac?"checked":""} style="width:auto"> ${t("onlyVac")}</label></div>
 <div class="grid">${bs.map(b=>{const c=cnt(b.id);return`
 <a class="card" href="#/b/${b.id}">
 <div class="ph" ${b.exterior?`style="background-image:url('${esc(thumb(b.exterior,500))}')"`:""}>${b.exterior?"":"🏢"}</div>
 <div class="pad"><h3>${esc(bName(b))}</h3><div class="mut">${esc(b.address)}</div>
 <div style="margin-top:6px"><span class="badge b-gray">${c.n} ${t("units")}</span><span class="badge b-vac">${c.v} ${t("vacant")}</span></div>
 <div class="mut">🚗 ${b.parking?esc(b.parking):"—"} · 🚲 ${b.bikeMin?esc(b.bikeMin)+" "+t("min"):"—"}</div></div></a>`}).join("")}</div>`;
 $("#q").oninput=e=>{HOME.q=e.target.value;const p=e.target.selectionStart;rHome();const i=$("#q");i.focus();i.setSelectionRange(p,p)};
 $("#ov").onchange=e=>{HOME.onlyVac=e.target.checked;rHome()};
}
const stBadge=s=>s.code==="vac"?`<span class="badge b-vac">${t("vacant")}</span>`:s.code==="occ"?`<span class="badge b-occ">${t("occupied")}</span>`+(s.leaving?`<span class="badge b-res">${t("leavingOn")} ${s.leaving}</span>`:""):`<span class="badge b-res">${t("reserved")} ${s.fut[0].moveIn}</span>`;
const shortName=p=>{if(!p)return"";const n=lang==="ja"?(p.nameJa||p.nameRo):(p.nameRo||p.nameJa);return n.split(" ").slice(0,2).join(" ")};

 ${shown.length?`<div class="units">${shown.map(({u,s})=>`<a class="unit" style="background:var(--${s.code==="vac"?"ok":s.code==="occ"?(s.leaving?"warn":"bad"):"warn"})" href="#/u/${u.id}">${esc(u.number)}<small>${s.code==="vac"?t("vacant"):s.code==="occ"?esc(shortName(pById(s.tit.personId))||t("occupied")):t("reserved")}</small></a>`).join("")}</div>`:`<p class="mut">${t("noUnits")}</p>`}`;

function facRow(u){

/* ---------- Vistoria (formulário separado) ---------- */
let INS=null,inspPreset={};
function rInspect(unitId,insId){
 const u=uById(unitId);if(!u)return nav("");
 const b=bById(u.buildingId)||{};
 const ex=insId&&insId!=="new"?D.inspections.find(x=>x.id===insId):null;
 if(!INS||INS.unitId!==unitId||INS.insId!==(ex?ex.id:"")){
  const items={};
  CHK.forEach(c=>{items[c.k]=ex?decodeItem(ex[c.k]):(c.app&&!has(u[c.k])?{s:"na",n:""}:{s:"",n:""})});
  const s=status(u);
  INS={unitId,insId:ex?ex.id:"",date:ex?ex.date:today(),type:ex?ex.type:(inspPreset.type||"定期"),
   personId:ex?ex.personId:(inspPreset.personId!==undefined?inspPreset.personId:(s.tit?s.tit.personId:"")),
   inspector:ex?ex.inspector:(localStorage.getItem("inspector")||""),other:ex?ex.other:"",notes:ex?ex.notes:"",items};
  inspPreset={};
 }
 // moradores relacionados a este apartamento (mais recentes primeiro)
 const seen=new Set(),opts=[];staysOf(unitId).forEach(s=>{if(s.personId&&!seen.has(s.personId)){seen.add(s.personId);opts.push(s.personId)}});
 if(INS.personId&&!seen.has(INS.personId))opts.push(INS.personId);
 $("#app").innerHTML=`
 <div class="crumb"><a href="#/">${t("buildings")}</a> › <a href="#/b/${b.id}">${esc(bShort(b))}</a> › <a href="#/u/${u.id}">${esc(u.number)}</a> › ${t("inspection")}</div>
 <div class="card pad"><h2 style="margin:0 0 10px">📋 ${t("inspection")} — ${esc(bShort(b))} ${esc(u.number)}</h2>
  <div class="row2"><div class="f"><label>${t("inspDate")}</label><input type="date" id="i_date" value="${esc(INS.date)}"></div>
  <div class="f"><label>${t("inspType")}</label><select id="i_type">${TYPES.map(x=>`<option value="${x[0]}" ${INS.type===x[0]?"selected":""}>${t(x[1])}</option>`).join("")}</select></div></div>
  <div class="row2"><div class="f"><label>${t("inspector")}</label><input id="i_insp" value="${esc(INS.inspector)}"></div>
  <div class="f"><label>${t("inspWho")}</label><select id="i_who"><option value="">—</option>${opts.map(id=>`<option value="${id}" ${INS.personId===id?"selected":""}>${esc(pName(pById(id)))}</option>`).join("")}</select></div></div></div>
 <h3 class="sec">${t("sectApp")}</h3><div class="card pad" id="itemsApp"></div>
 <h3 class="sec">${t("sectGen")}</h3><div class="card pad" id="itemsGen"></div>
 <h3 class="sec">${t("other")}</h3>
 <div class="card pad"><textarea id="i_other" rows="3" placeholder="${t("otherPh")}">${esc(INS.other)}</textarea>
  <div class="f" style="margin-top:8px"><label>${t("memo")}</label><textarea id="i_notes" rows="2">${esc(INS.notes)}</textarea></div></div>
 <div class="sticky-save"><button class="btn" id="i_save">${t("save")}</button><button class="btn sec" id="i_all">${t("okAll")}</button><a class="btn sec" style="padding:9px 14px;border-radius:8px;border:1px solid var(--pri);color:var(--pri);font-size:14px" href="#/u/${u.id}" id="i_cancel">${t("cancel")}</a>
  ${insId&&ex?`<button class="btn red" id="i_del">${t("del")}</button>`:""}</div>`;
 drawItems(u);

/* =====================================================================
 * Modais e formulários
 * =================================================================== */
function modal(html){$("#layer").innerHTML=`<div class="modal"><div class="box">${html}</div></div>`}
const closeModal=()=>$("#layer").innerHTML="";
const fld=(id,label,val="",type="text",extra="")=>`<div class="f"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
const btns=(del)=>`<div class="bar"><button class="btn" id="ok">${t("save")}</button><button class="btn sec" id="no">${t("cancel")}</button>${del?`<button class="btn red" id="dl">${t("del")}</button>`:""}</div>`;
const pending={};
const photoFld=(id,label,max)=>`<div class="f"><label>${label}</label><input id="${id}" type="file" accept="image/*" ${max>1?"multiple":""}><div class="imgs" id="${id}_pv"></div></div>`;
function bindPhoto(id,existing,max){
 pending[id]=list(existing).slice();const pv=$("#"+id+"_pv");
 const draw=()=>{pv.innerHTML=pending[id].map((p,i)=>`<span style="position:relative"><img src="${esc(thumb(p,300))}"><button type="button" data-x="${i}" style="position:absolute;top:0;right:0;border:0;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer">×</button></span>`).join("")};
 draw();
 pv.onclick=e=>{const i=e.target.dataset.x;if(i!==undefined){pending[id].splice(+i,1);draw()}};
 $("#"+id).onchange=async e=>{for(const f of e.target.files){if(max===1)pending[id]=[];else if(pending[id].length>=max)break;pending[id].push(await shrink(f))}e.target.value="";draw()};
}
// Fotos leves: máx. 1000 px, JPEG 70 %
function shrink(file,max=1000,q=.7){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)})}
async function finalizePhotos(id,folder){const out=[];for(const p of pending[id])out.push(p.startsWith("data:")?await Store.upload(p,folder):p);return out}
async function guarded(fn,after){
 const btn=document.querySelector(".modal #ok");if(btn){btn.disabled=true;btn.textContent=t("uploading")}
 try{await fn();closeModal();toast(t("saved"));await reload();if(after)after()}
 catch(e){if(!e.silent)alert(t("err")+e.message);if(btn){btn.disabled=false;btn.textContent=t("save")}}
}
const silent=()=>{const e=new Error("cancel");e.silent=true;return e};

  await Store.upsert("units",row)});

/* Pessoa: reaproveita se já existir (mantém o histórico entre apartamentos) */
function findPerson(ja,ro){
 const n=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
 return D.persons.find(p=>(ja&&n(p.nameJa)===n(ja))||(ro&&n(p.nameRo)===n(ro)));
}
async function ensurePerson(ja,ro){
 ja=ja.trim();ro=ro.trim();if(!ja&&!ro)return"";
 const f=findPerson(ja,ro);
 if(f){if((ja&&!f.nameJa)||(ro&&!f.nameRo)){await Store.upsert("persons",{...f,nameJa:f.nameJa||ja,nameRo:f.nameRo||ro})}return f.id}
 const p={id:uid(),nameJa:ja,nameRo:ro,memo:""};await Store.upsert("persons",p);D.persons.push(p);return p.id;
}
const personInputs=(pf,withRemove)=>`<div class="row2 hm-row">${`<input list="dl_ja" class="p_ja" placeholder="${t("tenantJa")}">`}${`<input list="dl_ro" class="p_ro" placeholder="${t("tenantRo")}">`}</div>`;
function datalists(){return`<datalist id="dl_ja">${D.persons.filter(p=>p.nameJa).map(p=>`<option value="${esc(p.nameJa)}">${esc(p.nameRo)}</option>`).join("")}</datalist><datalist id="dl_ro">${D.persons.filter(p=>p.nameRo).map(p=>`<option value="${esc(p.nameRo)}">${esc(p.nameJa)}</option>`).join("")}</datalist>`}
function autofill(root){
 root.addEventListener("change",e=>{
  const row=e.target.closest(".hm-row");if(!row)return;
  const ja=row.querySelector(".p_ja"),ro=row.querySelector(".p_ro");

 });

 else if(a==="editStay")formStay(id);
 else if(a==="editPerson")formPerson(id);

});
